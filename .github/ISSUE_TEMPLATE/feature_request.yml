name: Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，再描述期望的方案；实现方式可以留空。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不方便，或缺少什么能力。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望页面或库怎么表现。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - EEPROM 解析器（#/parser）
        - EDA 转 KiCad（#/convert）
        - 设计预览
        - 独立库（lib/）
        - 构建 / 部署
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的替代做法，或现有的临时解决办法。
